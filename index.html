<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
    <script>
        function RunSentimentAnalysis() {
            const textToAnalyze = document.getElementById("textToAnalyze").value;
            const xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function () {
                if (this.readyState === 4 && this.status === 200) {
                    document.getElementById("system_response").innerHTML = this.responseText;
                }
            };
            xhttp.open(
                "GET",
                "/emotionDetector?textToAnalyze=" + encodeURIComponent(textToAnalyze),
                true
            );
            xhttp.send();
        }
    </script>
</head>
<body>
    <h1>Emotion Detector</h1>
    <label for="textToAnalyze">Enter text to analyze:</label>
    <input type="text" id="textToAnalyze" name="textToAnalyze">
    <button onclick="RunSentimentAnalysis()">Analyze</button>
    <p id="system_response"></p>
</body>
</html>
